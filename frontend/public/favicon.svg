<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    The same Earth as the app's brand mark, redrawn standalone: a favicon
    never receives the stylesheet, so every colour here is literal rather
    than a token. Sized for 16px first — the continents are deliberately
    few and broad, because anything finer turns to mud at tab size.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1638" />
      <stop offset="100%" stop-color="#122a63" />
    </linearGradient>
    <linearGradient id="ocean" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#11317a" />
    </linearGradient>
    <linearGradient id="atmos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <clipPath id="sphere">
      <circle cx="24" cy="24" r="16.5" />
    </clipPath>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#tile)" />

  <!--
    The disc fills most of the tile and there is no thin outer ring: at 16px
    a 1.8px stroke and the gap inside it both collapse into a smudge, and
    what survives a downscale is the largest shape with the strongest colour
    contrast. A soft rim sits inside the edge instead, which reads as
    atmosphere without needing its own pixels.
  -->
  <circle cx="24" cy="24" r="16.5" fill="url(#ocean)" />
  <circle cx="24" cy="24" r="15.6" fill="none" stroke="url(#atmos)" stroke-width="1.6" stroke-opacity="0.5" />

  <!-- landmasses -->
  <g clip-path="url(#sphere)" fill="#3fae6a">
    <path d="M9.5 17c2.8-2.6 6.4-3.3 9.1-1.9 2.4 1.2 2.7 3.6 1.1 5-1.4 1.2-3.7 1.1-5 2.4-1.4 1.4-.8 3.3-2.8 3.9-2.2.6-4.1-1.5-4.3-4-.2-2.1.9-3.9 1.9-5.4z" />
    <path d="M20.6 26.4c2.1-.8 4.1.3 4.7 2.3.7 2.5-.8 4.6-1.4 6.9-.5 2.5-.3 5.4-2.2 6.5-1.8 1-3.7-.6-4.3-2.8-.7-2.8.4-5.5 1.1-8.2.4-1.8.6-4 2.1-4.7z" />
    <path d="M30 12.4c3.3-1.2 7.2-.4 9.1 2 1.7 2 1.1 4.6-.8 5.5-2.1 1.1-4.6.3-6.8 1-1.9.7-3.6 2.6-5.5 1.9-1.8-.7-2.2-3-1.2-4.7 1.1-2.1 3.2-4.8 5.2-5.7z" />
    <path d="M31.5 27.8c2.2-.7 4.6.8 4.9 3 .3 2.2-1.5 3.9-3.5 4.4-1.8.5-4 .1-4.8-1.5-1-1.9.8-5.1 3.4-5.9z" />
  </g>

  <!-- shadowed limb -->
  <path d="M24 7.5a16.5 16.5 0 0 1 0 33 21 21 0 0 0 0-33z" fill="#050a1c" fill-opacity="0.28" />
</svg>
