<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mausam-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2c6b" />
      <stop offset="52%" stop-color="#1d5fd6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="mausam-planet" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7e4ff" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#mausam-tile)" />

  <!-- back half of the orbital ring -->
  <g transform="rotate(-24 24 24)">
    <ellipse cx="24" cy="24" rx="19.5" ry="7.4" fill="none"
             stroke="#bff0ff" stroke-opacity="0.55" stroke-width="2" />
  </g>

  <!-- planet -->
  <circle cx="24" cy="24" r="10.5" fill="url(#mausam-planet)" />
  <path d="M24 13.5a10.5 10.5 0 0 1 0 21 13.6 13.6 0 0 0 0-21z" fill="#1d5fd6" fill-opacity="0.16" />

  <!-- front half of the ring, drawn over the planet -->
  <g transform="rotate(-24 24 24)">
    <path d="M4.5 24a19.5 7.4 0 0 0 39 0" fill="none"
          stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <circle cx="41.2" cy="16.6" r="2.6" fill="#eaf9ff" />
</svg>
